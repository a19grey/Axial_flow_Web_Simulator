name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # CI runners have no GPU, so everything here runs on SwiftShader. Fields are still correct, so
    # the analytic cases are a real check; timings are meaningless and the suites that need a real
    # GPU (reference comparison, convergence studies) are left to run locally.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Module syntax
        run: |
          for f in $(git ls-files '*.js'); do node --check "$f" || exit 1; done

      # Grid 80 rather than the default 128: it clears both tolerances with margin (loop 0.26%
      # against 1%, sphere 7.7% against 9%) and is four times less work. At 128 this step ran for
      # over five minutes on a runner's software adapter. See docs/numerics.md.
      - name: Analytic validation cases
        timeout-minutes: 6
        run: node cli/run.js validate --allow-software --quiet --set mesh.cellsAcrossDiameter=80

      - name: Full-page smoke test
        timeout-minutes: 8
        run: node tests/smoke-ui.js --allow-software
